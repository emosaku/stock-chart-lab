# Stock Chart Lab settings: what to analyse and with which parameters.
# Environment-specific values (DB path, GCP project, storage backend) live in .env;
# this file holds the *analysis* choices and is committed.
#
# Sections below `data` are filled in by their phase. Until then they're placeholders,
# so the shape of the config is visible from day one.

data:
  # Add a ticker here and the next `stocklab ingest` backfills its full history.
  tickers: [GOOG, META, AMZN]
  # Earliest date to request. yfinance returns from the listing date when that's
  # later (META only listed in May 2012), so "10+ years where available".
  start_date: "2010-01-01"
  # null = up to the latest completed trading day.
  end_date: null
  # Trading calendar that defines which days should have a bar (XNYS = NYSE).
  calendar: XNYS
  # Incremental runs re-fetch the last N stored sessions to catch late corrections and
  # detect when Yahoo has restated history (new dividend/split) -> full refresh.
  overlap_days: 5
  restatement_tolerance: 0.0001   # 0.01% relative change in close counts as restated
  # Data-quality: flag any single-day adjusted-close move bigger than this (25%).
  # Real moves this big happen (META fell 26% on 2022-02-03), so it's a warning.
  max_daily_move: 0.25

# Phase 2. All computed from the split-adjusted close/high/low (see
# docs/price-basis-decision.md); every value on day t uses only bars up to day t.
indicators:
  sma_windows: [20, 50, 200]    # simple moving averages: ~1 month, ~1 quarter, ~1 year
  ema_windows: [20, 50, 200]    # exponential moving averages: same spans, weighted to recent days
  rsi_length: 14                # Wilder's standard
  macd: {fast: 12, slow: 26, signal: 9}
  bollinger: {length: 20, std: 2.0}
  atr_length: 14
  volume_ma_window: 20
# Phase 3. A signal is an *event*: the day something changes (a line crosses another,
# RSI leaves a zone), not every day a condition holds. Detected at the close of day t
# from data up to t; Phase 4 trades on the next bar.
signals:
  cross_fast_sma: 50        # golden cross = 50-day SMA crosses above the 200-day
  cross_slow_sma: 200
  rsi_oversold: 30          # RSI rising back above 30 = oversold recovery (bullish)
  rsi_overbought: 70        # RSI falling back below 70 = overbought reversal (bearish)
  pivot_window: 5           # swing high/low = extreme of 5 bars either side (~2 weeks)
  max_level_age: 250        # support/resistance older than ~1 trading year is ignored
backtest: {}      # Phase 4: fees, slippage, initial cash
models: {}        # Phase 5: walk-forward window sizes, feature lags, model params
